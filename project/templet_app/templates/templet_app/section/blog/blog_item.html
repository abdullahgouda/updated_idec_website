{% load static %}
{% load i18n %}
<!-- blog_item.html -->

    <div class="blog-wrapper">
        <div class="blog-image">
            {% if blog_data.blog.photo %}
                <img src="{{ blog_data.blog.photo.url }}" class="img-fluid" alt="img"  style="width: 100%; height: 100%; object-fit: cover;">
            {% else %}
                <img src="{% static 'assets/images/default-blog-image.jpg' %}" class="img-fluid" alt="img" style="width: 100%; height: 100%; object-fit: cover;">
            {% endif %}
        </div>
        <div class="blog-details">
            <p>{{ blog_data.blog.created_at|date:"d F Y" }} / {{ blog_data.blog.categories.name }}</p>
            <h5 class="blog-title fs-5 fw-semibold">
                <a href="{% url 'custom_view:blog_detail' blog_data.blog.id %}" class="link-hover-animation-1 stretched-link text-decoration-none">
                    {{ blog_data.blog.title }}
                </a>
            </h5>
        </div>
    </div>
